services:
  postgres:
    image: postgres:16-alpine
    container_name: smriti-postgres
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: smriti_dev
      POSTGRES_DB: smriti_dev
    ports:
      - "5432:5432"
    volumes:
      - smriti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smriti -d smriti_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: smriti-api
    environment:
      DATABASE_URL: postgresql://smriti:smriti_dev@postgres:5432/smriti_dev
      JWT_SECRET_KEY: replace-with-a-32-byte-random-string
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - smriti_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smriti_pg_data:
  smriti_uploads:
